final mdkZip = forgedev.consumeFile("mdkZip", project(':forge-mdk'))
convention.publish {
    artifact universalJar
    artifact forgedev.installer.jar
    artifact(mdkZip.map { it.singleFile }) {
        builtBy mdkZip
        classifier = "mdk"
        extension = "zip"
    }
    artifact forgedev.userDev.jar
    artifact sourcesJar
    artifact serverShim.jar
}

