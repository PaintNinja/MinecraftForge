pluginManagement {
    if (new File('forgedev/settings.gradle').exists())
        includeBuild 'forgedev'

    includeBuild('build-logic')

    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.minecraftforge.net/' }
        //mavenLocal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'forge'

// The FML projects (fmlloader, fmlcore, mclanguage, javafmllanguage, lowcodelanguage, fmlearlydisplay,
// forge-transformers, forge-examiner) have been replaced by ModuleLoader. Their sources are kept for reference while porting.
include 'forge-tests'
include 'forge-mdk'
include 'forge-hello'
include 'forge-runtime-transformers'

enableFeaturePreview 'TYPESAFE_PROJECT_ACCESSORS'

dependencyResolutionManagement.versionCatalogs {
    register('bootLibs') {
        description = 'Java, Minecraft, and MCP versions'
        from(files('minecraft.versions.toml'))
    }

    register('buildLibs') {
        description = 'Libraries used solely during the build and publish process.'
        from(files('gradle/buildLibs.versions.toml'))
    }

    register('libs') {
        description = 'Libraries used by Forge and its subprojects.'
    }

    register('earlyDisplayLibs') {
        from(files('gradle/earlyDisplayLibs.versions.toml'))
    }

    register('earlyDisplayTestLibs') {
        from(files('gradle/earlyDisplayTestLibs.versions.toml'))
    }
}
